<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>פנקס פתקים - Firebase</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
      --primary: #4a6fa5;
      --primary-hover: #3b5c8a;
      --urgent: #f59e0b; 
      --urgent-glow: rgba(245, 158, 11, 0.15);
      --border: #e9ecef;
      --shadow: 0 4px 6px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.05);
      --shadow-hover: 0 10px 20px rgba(0,0,0,0.06), 0 3px 6px rgba(0,0,0,0.04);
      --radius: 12px;
      --shared-color: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 80px; }

    .container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #1e293b; }
    
    .btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .btn-archive-toggle { font-size: 0.9rem; color: var(--primary); font-weight: 600; padding: 6px 12px; border-radius: 20px; background: #eef2f7; }

    /* בר חיפוש */
    .search-wrapper { margin-bottom: 16px; position: relative; }
    .search-input { width: 100%; padding: 10px 40px 10px 14px; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 20px; background: var(--card-bg); outline: none; box-shadow: var(--shadow); transition: all 0.2s; }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1); }
    .search-icon { position: absolute; top: 50%; right: 14px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; font-size: 1rem; }

    /* בר קטגוריות */
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-chip { padding: 6px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; font-size: 0.9rem; white-space: nowrap; cursor: pointer; color: var(--text-muted); transition: all 0.2s; user-select: none; position: relative; }
    .cat-chip:hover { background: #f1f3f5; color: var(--text-main); }
    .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }
    .cat-chip.urgent-chip { border-color: #fcd34d; background: #fffbeb; color: #b45309; }
    .cat-chip.urgent-chip.active { background: var(--urgent); color: white; border-color: var(--urgent); }

    /* רשת הפתקים */
    .notes-list { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
      gap: 16px; 
    }
    
    .note-card { 
      background: var(--card-bg); 
      border: 2px solid var(--cat-border-color); 
      border-radius: var(--radius); 
      padding: 14px; 
      box-shadow: var(--shadow); 
      display: flex; 
      flex-direction: column; 
      height: 220px; 
      position: relative;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      overflow: hidden;
    }
    
    .note-card:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: var(--shadow-hover);
      border-color: var(--cat-border-color, #cbd5e1);
    }
    
    .note-card.is-urgent { 
      border-color: var(--urgent);
      box-shadow: 0 0 12px var(--urgent-glow), var(--shadow);
    }
    .note-card.is-urgent:hover {
      border-color: var(--urgent);
      box-shadow: 0 0 16px var(--urgent-glow), var(--shadow-hover);
    }
    
    .note-text { 
      font-size: 0.95rem; 
      line-height: 1.5; 
      white-space: pre-wrap; 
      word-break: break-word; 
      overflow-y: auto; 
      flex: 1; 
      margin-bottom: 10px;
      padding-left: 4px; 
    }
    
    .note-text::-webkit-scrollbar { width: 4px; }
    .note-text::-webkit-scrollbar-track { background: transparent; }
    .note-text::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; opacity: 0.5; }

    .note-footer { 
      margin-top: auto;
      border-top: 1px solid var(--border); 
      padding-top: 8px; 
      background: var(--card-bg);
      z-index: 2;
    }
    .note-card.is-urgent .note-footer { background: transparent; }

    .note-meta { 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 8px;
      align-items: center;
    }
    .note-date { font-weight: 500; }
    
    .cat-badge {
      font-weight: 600;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: var(--cat-bg-color);
      color: var(--cat-text-color);
      border: 1px solid var(--cat-border-color);
    }

    .note-actions { 
      display: flex; 
      justify-content: space-between; 
      color: var(--text-muted); 
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }
    @media (hover: hover) {
      .note-card:hover .note-actions { opacity: 1; }
    }
    @media (hover: none) {
      .note-actions { opacity: 1; }
    }
    
    .note-actions .btn { color: var(--text-muted); font-size: 1.1rem; padding: 2px; }
    .note-actions .btn:hover { color: var(--text-main); transform: scale(1.15); }

    .fab { position: fixed; bottom: 20px; left: 20px; width: 56px; height: 56px; background: var(--primary); color: white; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-size: 1.8rem; z-index: 10; transition: all 0.2s; }
    .fab:hover { background: var(--primary-hover); transform: scale(1.05); }

    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 100; transition: all 0.3s ease; }
    .modal { background: white; width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 16px; animation: slideUp 0.3s ease-out; max-height: 85vh; position: relative; }
    
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header-actions { display: flex; justify-content: space-between; align-items: center; }
    .btn-fullscreen { font-size: 0.9rem; color: var(--text-muted); padding: 6px 12px; border-radius: 20px; background: #f1f3f5; font-weight: 600; }
    .btn-fullscreen:hover { color: var(--primary); background: #eef2f7; }

    textarea { width: 100%; height: 200px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 1rem; resize: none; outline: none; transition: height 0.2s; }
    textarea:focus { border-color: var(--primary); }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
    select { padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; outline: none; background: white; }

    .modal-buttons { display: flex; gap: 10px; margin-top: 8px; }
    .btn-block { flex: 1; padding: 12px; border-radius: var(--radius); font-size: 1rem; font-weight: 600; text-align: center; }
    .btn-submit { background: var(--primary); color: white; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-cancel { background: #f1f3f5; color: var(--text-main); }
    .btn-cancel:hover { background: #e2e6ea; }

    .modal.fullscreen-mode {
      max-width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      animation: none;
    }
    .modal.fullscreen-mode textarea { flex: 1 !important; height: auto !important; }

    #toast { position: fixed; bottom: 90px; right: 50%; transform: translateX(50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; display: none; z-index: 1000; }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <header>
      <h1 id="app-title">פנקס פתקים (Firebase)</h1>
      <button class="btn btn-archive-toggle" id="archive-view-btn" onclick="toggleArchiveView()">ארכיון</button>
    </header>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="חפש בתוך הפתקים שלך..." oninput="renderNotes()">
    </div>

    <div class="categories-bar" id="categories-container"></div>
    <div class="notes-list" id="notes-container"></div>
  </div>

  <button class="btn fab" id="fab-btn" onclick="openAddModal()">+</button>

  <div class="overlay" id="note-modal" onclick="if(event.target===this) closeModal()">
    <div class="modal" id="modal-box">
      <div class="modal-header-actions">
        <h3 id="modal-title">פתק חדש</h3>
        <button class="btn btn-fullscreen" onclick="toggleFullscreenModal()" id="fs-btn">🔲 מסך מלא</button>
      </div>
      <textarea id="note-text-input" placeholder="כתוב משהו..."></textarea>
      <div class="form-group" id="cat-select-group">
        <label>קטגוריה</label>
        <div style="display: flex; gap: 8px;">
          <select id="note-cat-select" style="flex: 1;"></select>
          <button class="btn" onclick="addNewCategory()" title="הוסף קטגוריה חדשה" style="background: #eef2f7; padding: 0 16px; border-radius: var(--radius); color: var(--primary); font-weight: 700;">➕</button>
        </div>
      </div>
      <div class="modal-buttons">
        <button class="btn btn-block btn-cancel" onclick="closeModal()">ביטול</button>
        <button class="btn btn-block btn-submit" id="save-modal-btn" onclick="saveNote()">שמירה</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- טעינת ספריות Firebase וניהול לוגיקה -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAngVWlat_rJQO3lxU6QgiubCCg39EgTtU",
      authDomain: "notes-1ea7c.firebaseapp.com",
      projectId: "notes-1ea7c",
      storageBucket: "notes-1ea7c.firebasestorage.app",
      messagingSenderId: "708973221800",
      appId: "1:708973221800:web:d68ddcb51e69e8a450af9d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentView = 'active'; 
    let currentCategory = 'הכל';
    let allNotes = [];
    let categories = ['כללי', 'עבודה', 'אישי', 'רעיונות'];
    let editingNoteId = null;

    window.onload = function() {
      loadCategoriesFromStorage();
      loadNotes();
    };

    window.loadCategoriesFromStorage = function() {
      const saved = localStorage.getItem('notes_categories');
      if (saved) {
        try { categories = JSON.parse(saved); } catch(e) {}
      }
      renderCategories();
    }

    window.saveCategoriesToStorage = function() {
      localStorage.setItem('notes_categories', JSON.stringify(categories));
    }

    window.loadNotes = async function() {
      document.getElementById('notes-container').innerHTML = '<p style="text-align:center; color:var(--text-muted); grid-column: 1/-1;">טוען פתקים...</p>';
      try {
        const querySnapshot = await getDocs(collection(db, "notes"));
        allNotes = [];
        querySnapshot.forEach((docSnap) => {
          allNotes.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderNotes();
      } catch (err) {
        console.error("שגיאה בטעינת פתקים:", err);
        showToast("שגיאה בטעינת פתקים (ייתכן שאופליין)");
      }
    }

    window.renderCategories = function() {
      const container = document.getElementById('categories-container');
      container.innerHTML = '';
      
      const allChip = document.createElement('div');
      allChip.className = `cat-chip ${currentCategory === 'הכל' ? 'active' : ''}`;
      allChip.innerText = 'הכל';
      allChip.onclick = () => { currentCategory = 'הכל'; renderCategories(); renderNotes(); };
      container.appendChild(allChip);

      const urgentChip = document.createElement('div');
      urgentChip.className = `cat-chip urgent-chip ${currentCategory === '⭐ דחוף' ? 'active' : ''}`;
      urgentChip.innerText = '⭐ דחוף';
      urgentChip.onclick = () => { currentCategory = '⭐ דחוף'; renderCategories(); renderNotes(); };
      container.appendChild(urgentChip);

      categories.forEach(c => {
        const colors = getCategoryColor(c);
        const chip = document.createElement('div');
        chip.className = `cat-chip ${currentCategory === c ? 'active' : ''}`;
        chip.innerText = c;
        if (currentCategory !== c) {
          chip.style.background = colors.bg;
          chip.style.color = colors.text;
          chip.style.borderColor = colors.border;
        }
        chip.onclick = () => { currentCategory = c; renderCategories(); renderNotes(); };
        container.appendChild(chip);
      });

      const select = document.getElementById('note-cat-select');
      select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    window.renderNotes = function() {
      const container = document.getElementById('notes-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      
      let filtered = allNotes.filter(note => {
        const isArchived = note.archived === true;
        return currentView === 'active' ? !isArchived : isArchived;
      });

      if (currentCategory === '⭐ דחוף') {
        filtered = filtered.filter(note => note.urgent === 'דחוף');
      } else if (currentCategory !== 'הכל') {
        filtered = filtered.filter(note => note.category === currentCategory);
      }

      if (searchQuery !== "") {
        filtered = filtered.filter(note => {
          const text = note.text ? note.text.toLowerCase() : "";
          return text.includes(searchQuery);
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px; grid-column: 1/-1;">אין פתקים להצגה</p>';
        return;
      }

      let html = '';
      filtered.forEach(note => {
        const { id, text, date, category, urgent } = note;
        const isUrgentClass = urgent === 'דחוף' ? 'is-urgent' : '';
        const colors = getCategoryColor(category || 'כללי');
        const cardVars = `style="--cat-bg-color: ${colors.bg}; --cat-border-color: ${colors.border}; --cat-text-color: ${colors.text};"`;

        html += `
          <div class="note-card ${isUrgentClass}" id="note-${id}" ${cardVars}>
            <div class="note-text">${escapeHtml(text || '')}</div>
            <div class="note-footer">
              <div class="note-meta">
                <span class="note-date">${date || ''}</span>
                <span class="cat-badge">${category || 'כללי'}</span>
              </div>
              <div class="note-actions">
                <button class="btn" onclick="toggleUrgent('${id}')" title="דחוף">${urgent === 'דחוף' ? '⭐' : '☆'}</button>
                <button class="btn" onclick="openEditModal('${id}', \`${escapeRowText(text || '')}\`, '${category || 'כללי'}')" title="עריכה">✏️</button>
                <button class="btn" onclick="toggleArchive('${id}')" title="${currentView === 'active' ? 'ארכיון' : 'שחזר'}">${currentView === 'active' ? '📦' : '📤'}</button>
                <button class="btn" onclick="deleteNote('${id}')" title="מחיקה">🗑️</button>
              </div>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    window.getCategoryColor = function(catName) {
      if (catName === 'הכל' || catName === '⭐ דחוף') return { bg: '#ffffff', border: '#cbd5e1', text: '#1e293b' };
      let hash = 0;
      for (let i = 0; i < catName.length; i++) { hash = catName.charCodeAt(i) + ((hash << 5) - hash); }
      const hue = Math.abs(hash % 360);
      return { bg: `hsl(${hue}, 85%, 96%)`, border: `hsl(${hue}, 65%, 75%)`, text: `hsl(${hue}, 60%, 30%)` };
    }

    window.openAddModal = function() {
      editingNoteId = null;
      document.getElementById('modal-title').innerText = 'פתק חדש';
      document.getElementById('note-text-input').value = '';
      document.getElementById('note-modal').style.display = 'flex';
    }

    window.openEditModal = function(id, text, cat) {
      editingNoteId = id;
      document.getElementById('modal-title').innerText = 'עריכת פתק';
      document.getElementById('note-text-input').value = text;
      document.getElementById('note-cat-select').value = cat || "כללי";
      document.getElementById('note-modal').style.display = 'flex';
    }

    window.closeModal = function() {
      document.getElementById('note-modal').style.display = 'none';
    }

    window.saveNote = async function() {
      const text = document.getElementById('note-text-input').value.trim();
      if (!text) return;
      const btn = document.getElementById('save-modal-btn');
      btn.disabled = true;
      btn.innerText = 'שומר...';

      const dateStr = new Date().toLocaleDateString('he-IL') + ' ' + new Date().toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});

      try {
        if (editingNoteId) {
          const noteRef = doc(db, "notes", editingNoteId);
          await updateDoc(noteRef, { text: text });
          showToast("הפתק עודכן בהצלחה");
        } else {
          const cat = document.getElementById('note-cat-select').value;
          await addDoc(collection(db, "notes"), {
            text: text,
            category: cat,
            date: dateStr,
            urgent: 'רגיל',
            archived: false
          });
          showToast("הפתק נוסף בהצלחה");
        }
        closeModal();
        loadNotes();
      } catch (err) {
        console.error(err);
        showToast("שגיאה בשמירת הפתק");
      }
      btn.disabled = false;
      btn.innerText = 'שמירה';
    }

    window.toggleUrgent = async function(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      const newUrgent = note.urgent === 'דחוף' ? 'רגיל' : 'דחוף';
      try {
        await updateDoc(doc(db, "notes", id), { urgent: newUrgent });
        loadNotes();
      } catch(e) { showToast("שגיאה בעדכון"); }
    }

    window.toggleArchive = async function(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      const newArchived = !note.archived;
      try {
        await updateDoc(doc(db, "notes", id), { archived: newArchived });
        showToast(newArchived ? "הועבר לארכיון" : "שוחזר מהארכיון");
        loadNotes();
      } catch(e) { showToast("שגיאה בעדכון"); }
    }

    window.deleteNote = async function(id) {
      if (!confirm("האם למחוק פתק זה לצמיתות?")) return;
      try {
        await deleteDoc(doc(db, "notes", id));
        showToast("הפתק נמחק");
        loadNotes();
      } catch(e) { showToast("שגיאה במחיקה"); }
    }

    window.addNewCategory = function() {
      const newCat = prompt("הכנס את שם הקטגוריה החדשה:");
      if (newCat && newCat.trim() !== "") {
        const name = newCat.trim();
        if (!categories.includes(name)) {
          categories.push(name);
          saveCategoriesToStorage();
          renderCategories();
          showToast("הקטגוריה התווספה!");
        }
      }
    }

    window.toggleArchiveView = function() {
      currentView = currentView === 'active' ? 'archived' : 'active';
      document.getElementById('archive-view-btn').innerText = currentView === 'active' ? 'ארכיון' : 'פתקים פעילים';
      document.getElementById('archive-view-btn').style.background = currentView === 'active' ? '#eef2f7' : '#4a6fa5';
      document.getElementById('archive-view-btn').style.color = currentView === 'active' ? 'var(--primary)' : 'white';
      renderNotes();
    }

    window.toggleFullscreenModal = function() {
      const modal = document.getElementById('modal-box');
      const btn = document.getElementById('fs-btn');
      if (modal.classList.contains('fullscreen-mode')) {
        modal.classList.remove('fullscreen-mode');
        btn.innerHTML = '🔲 מסך מלא';
      } else {
        modal.classList.add('fullscreen-mode');
        btn.innerHTML = '🔳 חזור קטן';
      }
    }

    window.showToast = function(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    window.escapeHtml = function(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.escapeRowText = function(text) {
      return text.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
