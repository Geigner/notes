<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הפנקס - מרכז שליטה</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- ספריית הצפנה מאובטחת CryptoJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
  <style>
    :root {
      --bg-color: #f7f8fa;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #475569;
      --primary: #475d71;
      --primary-hover: #334155;
      --urgent: #d97706; 
      --urgent-glow: rgba(217, 119, 6, 0.12);
      --border: #cbd5e1;
      --shadow: 0 2px 4px rgba(0,0,0,0.01), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-hover: 0 8px 16px rgba(0,0,0,0.04);
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Assistant', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; overflow-x: hidden; }

    /* מצב טשטוש פרטיות - מתבטל במעבר עכבר (Hover) על פתק ספציפי */
    body.privacy-mode .note-card {
      filter: blur(7px);
      transition: filter 0.25s ease;
      user-select: none;
    }
    body.privacy-mode .note-card:hover {
      filter: blur(0px);
    }

    /* הקונטיינר הראשי זז ימינה באלגנטיות כשמרכז השליטה פתוח משמאל */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: none;
      padding: 0 20px;
      transition: margin-left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.sidebar-open .container {
      margin-left: 320px;
    }
    @media (max-width: 768px) {
      body.sidebar-open .container { margin-left: 0; }
    }
    
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      gap: 16px;
    }

    .auth-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: var(--shadow-hover);
      border: 1px solid var(--border);
      max-width: 380px;
      width: 100%;
    }

    .btn-google {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .btn-google:hover { background: #1557b0; }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 16px 20px; 
      margin-bottom: 12px; 
      position: sticky;
      top: 0;
      background: rgba(247, 248, 250, 0.95);
      backdrop-filter: blur(8px);
      z-index: 150;
      border-bottom: 1px solid rgba(203, 213, 225, 0.6);
    }
    
    .header-right, .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 { font-size: 1.3rem; font-weight: 600; color: #1e293b; letter-spacing: -0.3px; }
    
    .header-clock {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      padding: 4px 8px;
    }

    .gear-menu-trigger {
      background: #e2e8f0;
      border: none;
      font-size: 1.1rem;
      padding: 6px 10px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      color: #334155;
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gear-menu-trigger:hover {
      background: #cbd5e1;
      transform: rotate(30deg);
    }

    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .master-dropdown-menu {
      display: none;
      position: absolute;
      top: 120%;
      left: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
      padding: 10px;
      z-index: 250;
      min-width: 200px;
      flex-direction: column;
      gap: 6px;
    }
    .master-dropdown-menu.active {
      display: flex;
      animation: slideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .master-dropdown-wrapper {
      position: relative;
      display: inline-block;
    }

    .notes-counter-badge { font-size: 0.80rem; color: #334155; background: #e2e8f0; padding: 6px 12px; border-radius: 8px; font-weight: 600; text-align: center; margin-bottom: 4px; }
    
    .btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .btn-secondary { font-size: 0.85rem; color: #334155; font-weight: 600; padding: 8px 12px; border-radius: 8px; background: white; border: 1px solid var(--border); width: 100%; text-align: right; justify-content: flex-start; gap: 8px; }
    .btn-secondary:hover { background: #f8fafc; border-color: #94a3b8; color: var(--primary); }

    .search-dropdown-wrapper { position: relative; display: inline-block; }
    .search-trigger-btn { background: white; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; font-size: 1rem; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .search-trigger-btn:hover { background: #f8fafc; border-color: #94a3b8; }
    
    .search-popup-input { 
      display: none; 
      position: absolute; 
      top: 120%; 
      right: 0; 
      width: 210px; 
      max-width: 80vw;
      padding: 10px 14px; 
      font-size: 0.9rem; 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      background: white; 
      outline: none; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); 
      z-index: 220; 
      color: var(--text-main); 
    }
    .search-dropdown-wrapper .search-popup-input.active { 
      display: block; 
      animation: slideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
    }

    /* סרגל קטגוריות אופקי נגלל */
    .categories-scroll-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 8px 20px 16px 20px;
      margin-bottom: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .categories-scroll-wrapper::-webkit-scrollbar { height: 4px; }
    .categories-scroll-wrapper::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 4px; }
    
    .cat-chip { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; white-space: nowrap; cursor: pointer; color: #334155; transition: all 0.2s; user-select: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: white; box-shadow: var(--shadow); }
    .cat-chip:hover { background: #f1f5f9; color: var(--text-main); }
    .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: 600; }
    .cat-chip.urgent-chip { border-color: #fde68a; background: #fffbeb; color: #92400e; }
    .cat-chip.urgent-chip.active { background: var(--urgent); color: white; border-color: var(--urgent); }
    .cat-chip.shared-chip { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
    .cat-chip.shared-chip.active { background: #15803d; color: white; border-color: #15803d; }
    .cat-delete-btn { background: none; border: none; color: inherit; font-size: 0.8rem; cursor: pointer; padding: 0 2px; }

    /* פאנל צדדי מתקדם נפתח מצד שמאל */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      max-width: 90vw;
      height: 100vh;
      background: white;
      border-right: 1px solid var(--border);
      box-shadow: 5px 0 25px rgba(0,0,0,0.05);
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      overflow-y: auto;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .sidebar-title { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
    
    .accordion-section {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fafafa;
    }
    .accordion-header {
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
      background: #f1f5f9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background 0.2s;
    }
    .accordion-header:hover { background: #e2e8f0; }
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .accordion-section.open .accordion-content {
      max-height: 500px;
      padding: 10px;
    }

    .quick-link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .quick-link-item:hover { background: #f8fafc; border-color: #94a3b8; }
    
    .sidebar-quick-task { display: flex; gap: 6px; }
    .sidebar-quick-task input {
      flex: 1; padding: 8px 10px; font-size: 0.85rem;
      border: 1px solid var(--border); border-radius: 8px; outline: none; min-width: 0;
    }
    .sidebar-task-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .sidebar-task-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; background: white; border: 1px solid #e2e8f0;
      border-radius: 6px; font-size: 0.85rem; gap: 6px;
    }
    .sidebar-task-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .convert-task-btn {
      background: #f1f5f9; border: 1px solid var(--border); font-size: 0.75rem;
      padding: 2px 6px; border-radius: 4px; cursor: pointer; color: var(--primary); font-weight: 600;
    }
    .convert-task-btn:hover { background: #e2e8f0; }

    .add-link-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }
    .link-inputs-row {
      display: flex;
      gap: 4px;
    }
    .link-inputs-row input {
      flex: 1;
      font-size: 0.8rem;
      padding: 6px 8px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .notes-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .note-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 220px; position: relative; transition: all 0.2s ease; }
    .note-card:hover { box-shadow: var(--shadow-hover); border-color: #94a3b8; }
    .note-card.is-urgent { border-color: var(--urgent); box-shadow: 0 0 10px var(--urgent-glow), var(--shadow); }
    .note-card.is-pinned { border-color: var(--primary); background: #fcfdfe; }
    
    .note-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .note-card-title { font-size: 1.05rem; font-weight: 700; color: #1e293b; margin-bottom: 6px; display: block; }
    .note-date { font-size: 0.75rem; color: #475569; font-weight: 500; }
    
    .cat-badge-wrapper { position: relative; display: inline-block; }
    .cat-badge { font-weight: 600; font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; background-color: var(--cat-bg-color); color: var(--cat-text-color); border: 1px solid var(--cat-border-color); cursor: pointer; user-select: none; transition: opacity 0.2s, transform 0.1s; }
    .cat-badge:hover { opacity: 0.85; transform: scale(1.03); }
    .cat-dropdown-menu { position: absolute; top: 100%; right: 0; background: white; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; z-index: 60; min-width: 130px; padding: 4px 0; margin-top: 4px; }
    .cat-dropdown-menu.show { display: block; }
    .cat-dropdown-item { padding: 6px 12px; font-size: 0.8rem; color: var(--text-main); background: none; border: none; width: 100%; text-align: right; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .cat-dropdown-item:hover { background: #f8fafc; color: var(--primary); }

    .shared-badge { font-size: 0.75rem; color: #15803d; background: #dcfce7; padding: 3px 8px; border-radius: 8px; font-weight: 600; display: inline-block; margin-right: 4px; border: 1px solid #bbf7d0; }
    .edited-by-badge { font-size: 0.7rem; color: #0369a1; background: #e0f2fe; padding: 2px 6px; border-radius: 8px; font-weight: 600; display: inline-block; margin-right: 4px; }
    .locked-badge { font-size: 0.7rem; color: #b45309; background: #fef3c7; padding: 2px 6px; border-radius: 8px; font-weight: 600; display: inline-block; margin-right: 4px; border: 1px solid #fde68a; }

    .inline-textarea { width: 100%; flex: 1; border: 1px solid transparent; background: transparent; font-size: 0.95rem; line-height: 1.5; resize: none; outline: none; color: var(--text-main); font-family: 'Assistant', sans-serif; padding: 2px; border-radius: 4px; transition: border-color 0.2s, background 0.2s; min-height: 80px; }
    .inline-textarea:focus { border-color: var(--border); background: #fafafa; }
    .inline-textarea[readonly] { background: #f8fafc; cursor: default; border-color: #e2e8f0; }

    .checklist-container { display: flex; flex-direction: column; gap: 6px; margin: 4px 0; flex: 1; }
    .checklist-row { display: flex; align-items: flex-start; gap: 8px; font-size: 0.95rem; line-height: 1.4; color: var(--text-main); cursor: pointer; user-select: none; }
    .checklist-cb { cursor: pointer; font-size: 1.05rem; line-height: 1; margin-top: 2px; transition: transform 0.1s; color: var(--primary); }
    .checklist-cb:hover { transform: scale(1.15); }
    .checklist-text.checked { text-decoration: line-through; color: #94a3b8; }

    .note-image-preview { width: 100%; max-height: 120px; object-fit: cover; border-radius: 6px; margin-top: 8px; cursor: pointer; border: 1px solid var(--border); }
    .note-link-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 12px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: var(--primary); text-decoration: none; transition: background 0.2s; width: fit-content; }
    .note-link-btn:hover { background: #e2e8f0; }

    .save-inline-btn { display: none; align-self: flex-end; margin-top: 4px; padding: 3px 10px; font-size: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; }
    .save-inline-btn.show { display: block; }

    .menu-wrapper { position: relative; display: inline-block; }
    .menu-btn { background: none; border: none; font-size: 1.1rem; color: #475569; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .dropdown-menu { position: absolute; top: 100%; left: 0; background: white; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; z-index: 50; min-width: 185px; padding: 4px 0; }
    .dropdown-menu.show { display: block; }
    .dropdown-item { padding: 8px 14px; font-size: 0.85rem; color: var(--text-main); background: none; border: none; width: 100%; text-align: right; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .dropdown-item:hover { background: #f8fafc; color: var(--primary); }
    .dropdown-item.danger { color: #be123c; }

    .fab { position: fixed; bottom: 24px; left: 24px; width: 52px; height: 52px; background: var(--primary); color: white; border-radius: 50%; box-shadow: 0 4px 12px rgba(71,93,113,0.3); font-size: 1.6rem; z-index: 100; transition: transform 0.2s; display: none; }
    .fab:hover { background: var(--primary-hover); transform: scale(1.04); }

    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); display: none; justify-content: center; align-items: flex-end; z-index: 200; backdrop-filter: blur(2px); }
    .modal { background: white; width: 100%; max-width: 550px; border-radius: 16px 16px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: slideUp 0.25s ease-out; max-height: 90vh; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); transition: all 0.2s ease; overflow-y: auto; }
    
    .modal.fullscreen-mode { max-width: 100vw !important; height: 100vh !important; max-height: 100vh !important; border-radius: 0 !important; padding: 30px !important; }
    .modal.fullscreen-mode textarea.modal-textarea { height: calc(100vh - 240px) !important; }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .lightbox-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 500; backdrop-filter: blur(4px); padding: 20px; }
    .lightbox-overlay.show { display: flex; }
    .lightbox-content { position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center; }
    .lightbox-img { max-width: 100%; max-height: 80vh; border-radius: 8px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .lightbox-close { position: absolute; top: -40px; left: 0; background: white; color: var(--text-main); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

    .modal-header-actions { display: flex; justify-content: space-between; align-items: center; }
    .btn-fullscreen { font-size: 0.85rem; color: #334155; padding: 4px 10px; border-radius: 16px; background: #f1f5f9; font-weight: 600; cursor: pointer; border: none; }

    .textarea-wrapper { position: relative; width: 100%; }
    textarea.modal-textarea { width: 100%; height: 160px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; padding-bottom: 40px; font-size: 0.95rem; resize: none; outline: none; color: var(--text-main); background-color: #ffffff; }
    .voice-btn { position: absolute; bottom: 10px; left: 10px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .modal-image-preview-container { position: relative; display: none; align-items: center; gap: 10px; background: #f8fafc; padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); }
    .modal-image-preview-container.show { display: flex; }
    .modal-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #475569; }
    select, input[type="text"], input[type="password"] { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; outline: none; background: white; color: var(--text-main); }

    .option-panel { display: none; flex-direction: column; gap: 8px; padding: 10px; background: #fafafa; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 4px; animation: slideDown 0.2s ease; }
    .option-panel.show { display: flex; }

    .modal-buttons { display: flex; gap: 10px; margin-top: 4px; }
    .btn-block { flex: 1; padding: 8px; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; text-align: center; }
    .btn-submit { background: var(--primary); color: white; border: none; cursor: pointer; }
    .btn-cancel { background: #f1f5f9; color: var(--text-main); border: none; cursor: pointer; }

    #single-note-container { display: none; max-width: 650px; margin: 40px auto; background: white; border-radius: 16px; padding: 24px; box-shadow: var(--shadow-hover); border: 1px solid var(--border); flex-direction: column; gap: 16px; }
    .single-note-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; flex-wrap: wrap; gap: 8px; }

    .locked-card-prompt { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 10px; text-align: center; flex: 1; }
    .locked-card-prompt input { width: 100%; max-width: 200px; text-align: center; }

    .password-wrapper { position: relative; display: inline-flex; align-items: center; width: 100%; justify-content: center; }
    .password-wrapper input { width: 100%; padding-left: 36px; }

          activeEl.blur();
          return;

          return;

          toggleSidebar();

    function listenToSingleSharedNote(noteId, mode) {
      const docRef = doc(db, "notes", noteId);
      getDoc(docRef).then(async (docSnap) => {
        if (!docSnap.exists()) {
          document.getElementById('single-note-container').innerHTML = `
            <div style="text-align: center; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
              <h2 style="color: #be123c;">הפתק לא נמצא</h2>
              <p style="color: var(--text-muted);">יתכן שהפתק הוסר או שכתובת הקישור אינה נכונה.</p>
            </div>
          `;
          return;
        }

        const noteData = docSnap.data();
        document.getElementById('single-note-cat').innerText = noteData.category || 'כללי';
        document.getElementById('single-note-date').innerText = noteData.date || '';

        const modeBadge = document.getElementById('single-note-mode-badge');
        const textarea = document.getElementById('single-note-textarea');
        const saveBtn = document.getElementById('single-note-save-btn');
        const titleDisplay = document.getElementById('single-note-title-display');

        // קביעת המצב בפועל: רק אם הקישור מוגדר כ-edit וגם הפתק לא הוגדר כצפייה בלבד
        const effectiveEdit = (mode === 'edit' && noteData.shareMode !== 'view');
        currentSharedMode = effectiveEdit ? 'edit' : 'view';

        if (effectiveEdit) {
          document.title = `${noteData.title || 'פתק'} - משותף לעריכה | הפנקס`;
          modeBadge.innerText = '✏️ משותף לעריכה';
          modeBadge.style.background = '#dcfce7';
          modeBadge.style.color = '#166534';
          modeBadge.style.borderColor = '#bbf7d0';
          textarea.readOnly = false;
          textarea.style.backgroundColor = '#ffffff';
          saveBtn.style.display = 'block';
        } else {
          document.title = `${noteData.title || 'פתק'} - לצפייה בלבד | הפנקס`;
          modeBadge.innerText = '👁️ צפייה בלבד';
          modeBadge.style.background = '#f1f5f9';
          modeBadge.style.color = '#334155';
          modeBadge.style.borderColor = '#cbd5e1';
          textarea.readOnly = true;
          textarea.style.backgroundColor = '#f8fafc';
          saveBtn.style.display = 'none';
        }

        const statusPrefix = effectiveEdit ? '[לעריכה] ' : '[צפייה בלבד] ';
        titleDisplay.innerText = statusPrefix + (noteData.title || 'פתק משותף');
        titleDisplay.style.display = 'block';

        let displayedText = noteData.text || '';

        if (noteData.isLocked) {
          const pass = prompt("פתק זה נעול בסיסמה. אנא הזן סיסמה לצפייה:");
          try {
            const bytes = CryptoJS.AES.decrypt(noteData.text, pass);
            displayedText = bytes.toString(CryptoJS.enc.Utf8);
            if (!displayedText) throw new Error();
            window._activeSharedPassword = pass;
          } catch(e) {
            alert("סיסמה שגויה!");
            window.location.href = window.location.pathname;
            return;
          }
        }

        textarea.value = displayedText;

        if (noteData.imageUrl) {
          document.getElementById('single-note-img-area').innerHTML = `<img src="${noteData.imageUrl}" class="note-image-preview" onclick="openLightbox('${noteData.imageUrl}')" alt="תמונת פתק">`;
        }
        if (noteData.linkUrl) {
          document.getElementById('single-note-link-area').innerHTML = `<a href="${noteData.linkUrl}" target="_blank" class="note-link-btn">🔗 ${escapeHtml(noteData.linkTitle || noteData.linkUrl)}</a>`;
        }

        if (noteData.lastEditedBy) {
          const editedEl = document.getElementById('single-note-edited');
          editedEl.innerText = `✏️ נערך לאחרונה ע"י: ${noteData.lastEditedBy}`;
          editedEl.style.display = 'inline-block';
        }
      }).catch(err => {
        console.error(err);
        document.getElementById('single-note-container').innerHTML = `
          <div style="text-align: center; padding: 40px; display: flex; flex-direction: column; gap: 16px;">
            <h2 style="color: #be123c;">אין הרשאת גישה לפתק</h2>
            <p style="color: var(--text-muted);">השיתוף עבור פתק זה הופסק או שהקישור אינו תקף.</p>
          </div>
        `;
      });
    }

        renderCustomLinks();

            linkDeleteStates[id] = false;
            renderCustomLinks();

      } else {
        linkDeleteStates[id] = false;
        try {
          await deleteDoc(doc(db, "sidebar_links", id));

    function startRealtimeListener() {
      if (!currentUser) return;
      if (unsubscribeNotes) unsubscribeNotes();

      unsubscribeNotes = onSnapshot(collection(db, "notes"), (querySnapshot) => {
        allNotes = [];
        const activeCategoriesSet = new Set(['כללי']);

        querySnapshot.forEach((docSnap) => {
          const noteData = { id: docSnap.id, ...docSnap.data() };
          allNotes.push(noteData);
          if (noteData.category && noteData.category.trim() !== '') {
            activeCategoriesSet.add(noteData.category.trim());
          }
        });

        categories = Array.from(activeCategoriesSet);
        updateCounter();
        renderCategories();
        renderNotes();
      }, (error) => { console.error(error); });
    }

    let recognition = null;
    let isRecording = false;
    let baseTextBeforeRecording = '';

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'he-IL';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          interimTranscript += event.results[i][0].transcript;
        }
        const input = document.getElementById('note-text-input');
        input.value = baseTextBeforeRecording + (baseTextBeforeRecording && interimTranscript ? ' ' : '') + interimTranscript;
      };

      recognition.onerror = () => { stopVoiceRecognition(); };
      recognition.onend = () => { stopVoiceRecognition(); };
    }

    window.toggleVoiceRecognition = function() {
      if (!recognition) return alert("הדפדפן שלך אינו תומך בהמרת קול לטקסט.");
      if (isRecording) {
        recognition.stop();
        stopVoiceRecognition();
      } else {
        const input = document.getElementById('note-text-input');
        baseTextBeforeRecording = input.value.trim();
        try {
          recognition.start();
          isRecording = true;
          document.getElementById('voice-record-btn').innerText = '🔴';
          showToast("מקשיב... דבר עכשיו");
        } catch(err) { console.error(err); }
      }
    }

    function stopVoiceRecognition() {
      isRecording = false;
      const btn = document.getElementById('voice-record-btn');
      if (btn) btn.innerText = '🎤';
    }

    window.updateCounter = function() {
      const activeCount = allNotes.filter(n => !n.archived).length;
      const archivedCount = allNotes.filter(n => n.archived).length;
      const sharedCount = allNotes.filter(n => n.isShared === true).length;
      const publicCount = allNotes.filter(n => n.isPublic === true).length;
      
      let counterText = `${activeCount} פעילים | ${archivedCount} בארכיון`;
      if (sharedCount > 0) counterText += ` | 🔗 ${sharedCount} משותפים`;
      if (publicCount > 0) counterText += ` | 🌐 ${publicCount} מפורסמים`;
      const counterEl = document.getElementById('notes-counter');
      if (counterEl) counterEl.innerText = counterText;
    }

    window.toggleCategoryManagement = function() {
      isManagingCategories = !isManagingCategories;
      const btn = document.getElementById('manage-cat-btn');
      if (btn) btn.innerText = isManagingCategories ? '⚙️ סיום ניהול' : '⚙️ ניהול קטגוריות';
      renderCategories();
    }

    window.renderCategories = function() {
      const container = document.getElementById('categories-container');
      if (!container) return;
      container.innerHTML = '';

      const allChip = document.createElement('div');
      allChip.className = `cat-chip ${currentCategory === 'הכל' ? 'active' : ''}`;
      allChip.innerText = 'הכל';
      allChip.onclick = () => { currentCategory = 'הכל'; renderCategories(); renderNotes(); };
      container.appendChild(allChip);

      const urgentChip = document.createElement('div');
      urgentChip.className = `cat-chip urgent-chip ${currentCategory === '⭐ דחוף' ? 'active' : ''}`;
      urgentChip.innerText = '⭐ דחוף';
      urgentChip.onclick = () => { currentCategory = '⭐ דחוף'; renderCategories(); renderNotes(); };
      container.appendChild(urgentChip);

      const sharedChip = document.createElement('div');
      sharedChip.className = `cat-chip shared-chip ${currentCategory === '🔗 משותפים' ? 'active' : ''}`;
      sharedChip.innerText = '🔗 משותפים';
      sharedChip.onclick = () => { currentCategory = '🔗 משותפים'; renderCategories(); renderNotes(); };
      container.appendChild(sharedChip);

      categories.forEach(c => {
        const colors = getCategoryColor(c);
        const chip = document.createElement('div');
        chip.className = `cat-chip ${currentCategory === c ? 'active' : ''}`;
        
        let chipContent = `<span>${c}</span>`;
        if (isManagingCategories && c !== 'כללי') {
          chipContent += `<button class="cat-delete-btn" onclick="event.stopPropagation(); deleteCategory('${c}')" title="מחק קטגוריה">✕</button>`;
        }
        chip.innerHTML = chipContent;

        if (currentCategory !== c) {
          chip.style.background = colors.bg;
          chip.style.color = colors.text;
          chip.style.borderColor = colors.border;
        }

        chip.onclick = () => {
          if (isManagingCategories && c !== 'כללי') {
            renameCategory(c);
          } else {
            currentCategory = c;
            renderCategories();
            renderNotes();
          }
        };

        container.appendChild(chip);
      });

      const noteCatSelect = document.getElementById('note-cat-select');
      if (noteCatSelect) {
        noteCatSelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      }
    }

    window.renameCategory = async function(oldName) {
      const newName = prompt(`הכנס שם חדש לקטגוריה "${oldName}":`, oldName);
      if (!newName || newName.trim() === "" || newName === oldName) return;
      const trimmedNewName = newName.trim();
      
      if (categories.includes(trimmedNewName)) {
        alert("קטגוריה בשם זה כבר קיימת!");
        return;
      }

      try {
        const notesToUpdate = allNotes.filter(n => (n.category || 'כללי') === oldName);
        const updatePromises = notesToUpdate.map(note => 
          updateDoc(doc(db, "notes", note.id), { category: trimmedNewName })
        );
        await Promise.all(updatePromises);

        categories = categories.map(cat => cat === oldName ? trimmedNewName : cat);
        if (currentCategory === oldName) currentCategory = trimmedNewName;

        renderCategories();
        renderNotes();
        showToast(`הקטגוריה עודכנה ל-"${trimmedNewName}" בהצלחה`);
      } catch (e) { console.error(e); }
    }

    window.deleteCategory = async function(catName) {
      if (!confirm(`האם למחוק את הקטגוריה "${catName}"?`)) return;
      try {
        const updatePromises = allNotes.filter(n => n.category === catName).map(note => updateDoc(doc(db, "notes", note.id), { category: 'כללי' }));
        await Promise.all(updatePromises);
        categories = categories.filter(c => c !== catName);
        if (currentCategory === catName) currentCategory = 'הכל';
        showToast("הקטגוריה הוסרה בהצלחה");
      } catch (e) { console.error(e); }
    }

    window.renderNotes = function() {
      const container = document.getElementById('notes-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      
      let filtered = allNotes.filter(note => currentView === 'active' ? !note.archived : note.archived);

      if (currentCategory === '⭐ דחוף') filtered = filtered.filter(note => note.urgent === 'דחוף');
      else if (currentCategory === '🔗 משותפים') filtered = filtered.filter(note => note.isShared === true);
      else if (currentCategory !== 'הכל') filtered = filtered.filter(note => (note.category || 'כללי') === currentCategory);

      if (searchQuery !== "") {
        filtered = filtered.filter(note => 
          (note.text || "").toLowerCase().includes(searchQuery) || 
          (note.title || "").toLowerCase().includes(searchQuery)
        );
      }

      filtered.sort((a, b) => {
        if ((a.pinned ? 1 : 0) !== (b.pinned ? 1 : 0)) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px; grid-column: 1/-1;">אין פתקים להצגה</p>';
        return;
      }

      container.innerHTML = generateNotesHTML(filtered);
    }

    function renderNoteContent(id, text, isLocked) {
      if (isLocked && !unlockedNotes[id]) {
        return `
          <div class="locked-card-prompt">
            <span style="font-size: 1.5rem;">🔒</span>
            <span style="font-size: 0.85rem; font-weight: 600; color: #b45309;">פתק נעול בסיסמה</span>
            <div class="password-wrapper">
              <input type="password" id="card-unlock-${id}" placeholder="הכנס סיסמה..." aria-label="סיסמת פענוח לפתק" dir="ltr" style="font-size:0.85rem;" onkeydown="if(event.key==='Enter') unlockCardNote(event, '${id}')">
              <button type="button" class="eye-btn" onclick="togglePasswordVisibility('card-unlock-${id}', this)" aria-label="הצג או הסתר סיסמה">👁️</button>
            </div>
            <button class="btn btn-submit" style="padding: 4px 12px; font-size: 0.8rem; border-radius: 6px;" onclick="unlockCardNote(event, '${id}')">פענח</button>
          </div>
        `;
      }

      let actualText = text;
      if (isLocked && unlockedNotes[id]) {
        try {
          const bytes = CryptoJS.AES.decrypt(text, unlockedNotes[id]);
          actualText = bytes.toString(CryptoJS.enc.Utf8) || 'שגיאה בפענוח';
        } catch(e) { actualText = 'שגיאה בפענוח'; }
      }

      const lines = (actualText || "").split('\n');
      const hasChecklist = lines.some(line => line.trim().startsWith('[ ]') || line.trim().startsWith('[x]') || line.trim().startsWith('[X]'));

      if (!hasChecklist) {
        return `<label for="inline-text-${id}" style="display:none;">תוכן פתק</label><textarea class="inline-textarea" id="inline-text-${id}" aria-label="עריכת תוכן פתק" oninput="showInlineSave('${id}')">${escapeHtml(actualText || '')}</textarea>`;
      }

      let checklistHTML = '<div class="checklist-container">';
      lines.forEach((line, lineIndex) => {
        const trimmed = line.trim();
        if (trimmed.startsWith('[ ]') || trimmed.startsWith('[x]') || trimmed.startsWith('[X]')) {
          const isChecked = trimmed.startsWith('[x]') || trimmed.startsWith('[X]');
          const itemText = trimmed.replace(/^\[[ xX]\]/, '').trim();
          checklistHTML += `
            <div class="checklist-row" onclick="toggleChecklistItem('${id}', ${lineIndex})">
              <span class="checklist-cb" aria-hidden="true">${isChecked ? '☑️' : '☐'}</span>
              <span class="checklist-text ${isChecked ? 'checked' : ''}">${escapeHtml(itemText)}</span>
            </div>
          `;
        } else if (trimmed.length > 0) {
          checklistHTML += `<div style="margin: 2px 0; font-size: 0.95rem;">${escapeHtml(line)}</div>`;
        }
      });
      checklistHTML += '</div>';
      return checklistHTML;
    }

    window.unlockCardNote = function(event, id) {
      if (event) event.stopPropagation();
      const passInput = document.getElementById(`card-unlock-${id}`);
      if (!passInput) return;
      const pass = passInput.value;
      const note = allNotes.find(n => n.id === id);
      if (!note) return;

      try {
        const bytes = CryptoJS.AES.decrypt(note.text, pass);
        const original = bytes.toString(CryptoJS.enc.Utf8);
        if (!original) throw new Error();
        unlockedNotes[id] = pass;
        renderNotes();
        showToast("הפתק פוענח בהצלחה!");
      } catch (err) {
        showToast("סיסמה שגויה!");
      }
    }

    window.toggleChecklistItem = async function(id, lineIndex) {
      const note = allNotes.find(n => n.id === id);
      if (!note || !note.text) return;

      let textToModify = note.text;
      if (note.isLocked) {
        try {
          textToModify = CryptoJS.AES.decrypt(note.text, unlockedNotes[id]).toString(CryptoJS.enc.Utf8);
        } catch(e) { return; }
      }

      let lines = textToModify.split('\n');
      if (lines[lineIndex]) {
        let trimmed = lines[lineIndex].trim();
        if (trimmed.startsWith('[ ]')) lines[lineIndex] = lines[lineIndex].replace('[ ]', '[x]');
        else if (trimmed.startsWith('[x]') || trimmed.startsWith('[X]')) lines[lineIndex] = lines[lineIndex].replace(/\[[xX]\]/, '[ ]');
        
        let newText = lines.join('\n');
        if (note.isLocked) {
          newText = CryptoJS.AES.encrypt(newText, unlockedNotes[id]).toString();
        }

        try {
          await updateDoc(doc(db, "notes", id), { text: newText });
        } catch(err) { console.error(err); }
      }
    }

    window.togglePublicStatus = async function(id) {
      closeAllDropdowns();
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      const currentStatus = !!note.isPublic;
      try {
        await updateDoc(doc(db, "notes", id), { isPublic: !currentStatus });
        showToast(!currentStatus ? "הפתק פורסם באתר בהצלחה!" : "הפרסום הוסר מהפתק");
      } catch (err) {
        console.error(err);
        showToast("שגיאה בעדכון סטטוס הפרסום");
      }
    };

    function generateNotesHTML(notesArray) {
      let html = '';
      notesArray.forEach(note => {
        const { id, title, text, date, category, urgent, pinned, isShared, shareMode, isPublic, lastEditedBy, imageUrl, linkUrl, linkTitle, isLocked } = note;
        const catName = category || 'כללי';
        const colors = getCategoryColor(catName);
        const cardVars = `style="--cat-bg-color: ${colors.bg}; --cat-border-color: ${colors.border}; --cat-text-color: ${colors.text};"`;
        
        let sharedTag = '';
        if (isShared) {
          sharedTag = shareMode === 'view' 
            ? `<span class="shared-badge" style="background:#f1f5f9; color:#334155; border-color:#cbd5e1;">👁️ משותף (צפייה)</span>`
            : `<span class="shared-badge">✏️ משותף (עריכה)</span>`;
        }

        const publicTag = isPublic ? `<span class="shared-badge" style="background:#e0f2fe; color:#0369a1; border-color:#bae6fd;">🌐 מפורסם</span>` : '';
        const lockedTag = isLocked ? `<span class="locked-badge">🔒 נעול</span>` : '';
        const editedByTag = lastEditedBy ? `<span class="edited-by-badge">✏️ ${lastEditedBy}</span>` : '';
        const titleHtml = title ? `<span class="note-card-title">${escapeHtml(title)}</span>` : '';
        const imageElement = (imageUrl && (!isLocked || unlockedNotes[id])) ? `<img src="${imageUrl}" class="note-image-preview" onclick="openLightbox('${imageUrl}')" alt="תמונת פתק" title="לחץ להגדלה">` : '';
        
        let linkElement = '';
        if (linkUrl && (!isLocked || unlockedNotes[id])) {
          const displayTitle = linkTitle ? linkTitle : linkUrl;
          linkElement = `<a href="${linkUrl}" target="_blank" class="note-link-btn" onclick="event.stopPropagation()">🔗 ${escapeHtml(displayTitle)}</a>`;
        }

        let catMenuItemsHTML = categories.map(c => `
          <button class="cat-dropdown-item ${c === catName ? 'active-cat' : ''}" onclick="changeNoteCategory(event, '${id}', '${c}')">
            <span>${c}</span>${c === catName ? '✓' : ''}
          </button>
        `).join('') + `<div style="border-top:1px solid var(--border); margin:4px 0;"></div>
                       <button class="cat-dropdown-item" onclick="promptAndAddCategoryForNote(event, '${id}')"><span>➕ קטגוריה חדשה...</span></button>`;

        const shareBtnHTML = isShared 
          ? `<button class="dropdown-item" onclick="stopSharingNote('${id}')">🔒 הפסק שיתוף</button>`
          : '';
          
        const publicBtnText = isPublic ? '🌐 הסר פרסום' : '🌐 פרסם';

        const contentHTML = renderNoteContent(id, text, isLocked);
        const showSaveInline = !isLocked || unlockedNotes[id];

        html += `
          <div class="note-card ${urgent === 'דחוף' ? 'is-urgent' : ''} ${pinned ? 'is-pinned' : ''}" id="note-card-${id}" ${cardVars}>
            <div class="note-header-top">
              <div>
                <div class="cat-badge-wrapper">
                  <span class="cat-badge" onclick="toggleCatDropdown(event, '${id}')" aria-label="שינוי קטגוריה">${pinned ? '📌 ' : ''}${catName} ▾</span>
                  <div class="cat-dropdown-menu" id="cat-dropdown-${id}">${catMenuItemsHTML}</div>
                </div>
                ${sharedTag}
                ${publicTag}
                ${lockedTag}
                ${editedByTag}
              </div>
              <div style="display: flex; align-items: center; gap: 4px;">
                <span class="note-date">${date || ''}</span>
                <div class="menu-wrapper">
                  <button class="menu-btn" onclick="toggleDropdown(event, '${id}')" aria-label="תפריט אפשרויות לפתק">⋮</button>
                  <div class="dropdown-menu" id="dropdown-${id}">
                    <button class="dropdown-item" onclick="openEditModal('${id}', \`${escapeRowText(title || '')}\`, \`${escapeRowText(text || '')}\`, '${catName}', \`${imageUrl || ''}\`, \`${escapeRowText(linkUrl || '')}\`, \`${escapeRowText(linkTitle || '')}\`, ${!!isLocked})">✏️ עריכה מלאה</button>
                    <button class="dropdown-item" onclick="copyNoteText('${id}')">📋 העתק טקסט</button>
                    <button class="dropdown-item" onclick="togglePin('${id}')">${pinned ? '📌 שחרר סיכה' : '📌 הצמד לראש'}</button>
                    <button class="dropdown-item" onclick="toggleUrgent('${id}')">${urgent === 'דחוף' ? '☆ הסר דחוף' : '⭐ סמן כדחוף'}</button>
                    <button class="dropdown-item" onclick="togglePublicStatus('${id}')">${publicBtnText}</button>
                    <button class="dropdown-item" onclick="downloadSingleNote('${id}')">📥 הורד כקובץ TXT</button>
                    <button class="dropdown-item" onclick="shareNoteViaWhatsApp('${id}', false)">👁️ שיתוף בוואטצאפ (צפייה)</button>
                    <button class="dropdown-item" onclick="shareNoteViaWhatsApp('${id}', true)">✏️ שיתוף בוואטצאפ (עריכה)</button>
                    ${shareBtnHTML}
                    <button class="dropdown-item" onclick="toggleArchive('${id}')">${currentView === 'active' ? '📦 לארכיון' : '📤 שחזר'}</button>
                    <button class="dropdown-item danger" onclick="deleteNote('${id}')">🗑️ מחיקה</button>
                  </div>
                </div>
              </div>
            </div>
            ${titleHtml}
            ${contentHTML}
            ${linkElement}
            ${imageElement}
            ${showSaveInline ? `<button class="save-inline-btn" id="save-btn-${id}" onclick="saveInlineNote('${id}')">שמור שינויים</button>` : ''}
          </div>
        `;
      });
      return html;
    }

    window.toggleCatDropdown = function(event, id) {
      event.stopPropagation();
      const dropdown = document.getElementById(`cat-dropdown-${id}`);
      const isOpen = dropdown.classList.contains('show');
      closeAllDropdowns();
      if (!isOpen) dropdown.classList.add('show');
    }

    window.changeNoteCategory = async function(event, id, newCat) {
      event.stopPropagation();
      closeAllDropdowns();
      try {
        await updateDoc(doc(db, "notes", id), { category: newCat });
        showToast(`הקטגוריה שונתה ל-"${newCat}"`);
      } catch (err) { console.error(err); }
    }

    window.promptAndAddCategoryForNote = async function(event, id) {
      event.stopPropagation();
      closeAllDropdowns();
      const newCat = prompt("הכנס את שם הקטגוריה החדשה:");
      if (newCat && newCat.trim() !== "") {
        const catName = newCat.trim();
        if (!categories.includes(catName)) categories.push(catName);
        await changeNoteCategory(event, id, catName);
      }
    }

    window.copyNoteText = function(id) {
      closeAllDropdowns();
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      if (note.isLocked && !unlockedNotes[id]) {
        alert("יש לפענח את הפתק עם סיסמה לפני העתקה.");
        return;
      }
      let textToCopy = note.text;
      if (note.isLocked) {
        try { textToCopy = CryptoJS.AES.decrypt(note.text, unlockedNotes[id]).toString(CryptoJS.enc.Utf8); } catch(e){}
      }
      navigator.clipboard.writeText(textToCopy).then(() => showToast("הטקסט הועתק ללוח!"));
    }

    window.downloadSingleNote = function(id) {
      closeAllDropdowns();
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      if (note.isLocked && !unlockedNotes[id]) {
        alert("יש לפענח את הפתק עם סיסמה לפני הורדה.");
        return;
      }
      let textToDownload = note.text;
      if (note.isLocked) {
        try { textToDownload = CryptoJS.AES.decrypt(note.text, unlockedNotes[id]).toString(CryptoJS.enc.Utf8); } catch(e){}
      }
      const blob = new Blob([`כותרת: ${note.title || ''}\nקטגוריה: ${note.category || 'כללי'}\nתאריך: ${note.date || ''}\n\n${textToDownload}`], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `note_${id.slice(0, 6)}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    window.showInlineSave = function(id) {
      const btn = document.getElementById(`save-btn-${id}`);
      if (btn) btn.classList.add('show');
    }

    window.saveInlineNote = async function(id) {
      const textarea = document.getElementById(`inline-text-${id}`);
      const btn = document.getElementById(`save-btn-${id}`);
      const note = allNotes.find(n => n.id === id);
      btn.disabled = true;

      let newText = textarea.value.trim();
      if (note && note.isLocked && unlockedNotes[id]) {
        newText = CryptoJS.AES.encrypt(newText, unlockedNotes[id]).toString();
      }

      try {
        await updateDoc(doc(db, "notes", id), { 
          text: newText,
          lastEditedBy: null,
          lastEditedById: null
        });
        showToast("הפתק עודכן בהצלחה");
        btn.classList.remove('show');
      } catch (err) { console.error(err); }
      btn.disabled = false;
    }

    window.toggleDropdown = function(event, id) {
      event.stopPropagation();
      const dropdown = document.getElementById(`dropdown-${id}`);
      const isOpen = dropdown.classList.contains('show');
      closeAllDropdowns();
      if (!isOpen) dropdown.classList.add('show');
    }

    window.closeAllDropdowns = function() {
      document.querySelectorAll('.dropdown-menu, .cat-dropdown-menu').forEach(menu => menu.classList.remove('show'));
      document.getElementById('master-dropdown')?.classList.remove('active');
      document.getElementById('search-input')?.classList.remove('active');
    }

    window.getCategoryColor = function(catName) {
      if (catName === 'הכל' || catName === '⭐ דחוף' || catName === '🔗 משותפים') return { bg: '#f8fafc', border: '#cbd5e1', text: '#334155' };
      let hash = 0;
      for (let i = 0; i < catName.length; i++) { hash = catName.charCodeAt(i) + ((hash << 5) - hash); }
      const hue = Math.abs(hash % 360);
      return { bg: `hsl(${hue}, 60%, 97%)`, border: `hsl(${hue}, 40%, 75%)`, text: `hsl(${hue}, 60%, 25%)` };
    }

    window.openAddModal = function() {
      editingNoteId = null;
      currentImageBase64 = null;
      currentModalFontSize = 0.95;
      const textareaEl = document.getElementById('note-text-input');
      if (textareaEl) textareaEl.style.fontSize = `${currentModalFontSize}rem`;

      const titleInput = document.getElementById('note-title-input');
      if (titleInput) titleInput.value = '';
      if (textareaEl) textareaEl.value = '';
      const linkTitleEl = document.getElementById('modal-link-title');
      if (linkTitleEl) linkTitleEl.value = '';
      const linkUrlEl = document.getElementById('modal-link-url');
      if (linkUrlEl) linkUrlEl.value = '';
      const secureToggle = document.getElementById('modal-secure-toggle');
      if (secureToggle) secureToggle.checked = false;
      const securePass = document.getElementById('modal-secure-password');
      if (securePass) securePass.value = '';
      const passContainer = document.getElementById('modal-pass-container');
      if (passContainer) passContainer.style.display = 'none';
      const noteCatSelect = document.getElementById('note-cat-select');
      if (noteCatSelect) noteCatSelect.value = categories[0] || 'כללי';
      
      const previewBox = document.getElementById('modal-img-preview-box');
      if (previewBox) previewBox.classList.remove('show');
      const removeImgBtn = document.getElementById('remove-img-btn');
      if (removeImgBtn) removeImgBtn.style.display = 'none';
      
      document.getElementById('panel-img').classList.remove('show');
      document.getElementById('panel-link').classList.remove('show');
      document.getElementById('panel-lock').classList.remove('show');

      document.getElementById('note-modal').style.display = 'flex';
    }

    window.openEditModal = function(id, title, text, cat, imageUrl, linkUrl, linkTitle, isLocked) {
      closeAllDropdowns();
      editingNoteId = id;
      currentImageBase64 = imageUrl || null;
      currentModalFontSize = 0.95;
      const textareaEl = document.getElementById('note-text-input');
      if (textareaEl) textareaEl.style.fontSize = `${currentModalFontSize}rem`;

      let actualText = text;
      if (isLocked) {
        if (unlockedNotes[id]) {
          try { actualText = CryptoJS.AES.decrypt(text, unlockedNotes[id]).toString(CryptoJS.enc.Utf8); } catch(e){}
        } else {
          const pass = prompt("הכנס סיסמה לפתיחת וצפיית הפתק לעריכה:");
          try {
            actualText = CryptoJS.AES.decrypt(text, pass).toString(CryptoJS.enc.Utf8);
            if (!actualText) throw new Error();
            unlockedNotes[id] = pass;
          } catch(e) {
            alert("סיסמה שגויה!");
            return;
          }
        }
      }

      document.getElementById('note-title-input').value = title || '';
      textareaEl.value = actualText;
      document.getElementById('modal-link-url').value = linkUrl || '';
      document.getElementById('modal-link-title').value = linkTitle || '';
      document.getElementById('note-cat-select').value = cat || "כללי";
      
      const secureToggle = document.getElementById('modal-secure-toggle');
      const passContainer = document.getElementById('modal-pass-container');
      const securePass = document.getElementById('modal-secure-password');
      if (isLocked) {
        secureToggle.checked = true;
        passContainer.style.display = 'inline-flex';
        securePass.value = unlockedNotes[id] || '';
      } else {
        secureToggle.checked = false;
        passContainer.style.display = 'none';
        securePass.value = '';
      }

      const previewBox = document.getElementById('modal-img-preview-box');
      const removeBtn = document.getElementById('remove-img-btn');
      if (imageUrl) {
        document.getElementById('modal-thumb-img').src = imageUrl;
        previewBox.classList.add('show');
        removeBtn.style.display = 'block';
      } else {
        previewBox.classList.remove('show');
        removeBtn.style.display = 'none';
      }

      document.getElementById('panel-img').classList.remove('show');
      document.getElementById('panel-link').classList.remove('show');
      document.getElementById('panel-lock').classList.remove('show');

      if (imageUrl) document.getElementById('panel-img').classList.add('show');
      if (linkUrl) document.getElementById('panel-link').classList.add('show');
      if (isLocked) document.getElementById('panel-lock').classList.add('show');

      document.getElementById('note-modal').style.display = 'flex';
    }

    window.closeModal = function() { 
      const modalBox = document.getElementById('modal-box');
      if (modalBox) modalBox.classList.remove('fullscreen-mode');
      document.getElementById('note-modal').style.display = 'none'; 
    }

    window.handleImageSelection = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          currentImageBase64 = canvas.toDataURL('image/jpeg', 0.75);
          
          document.getElementById('modal-thumb-img').src = currentImageBase64;
          document.getElementById('modal-img-preview-box').classList.add('show');
          document.getElementById('remove-img-btn').style.display = 'block';
          showToast("התמונה נוספה בהצלחה!");
        }
      };
      reader.readAsDataURL(file);
    }

    window.clearModalImage = function() {
      currentImageBase64 = null;
      document.getElementById('modal-img-preview-box').classList.remove('show');
      document.getElementById('remove-img-btn').style.display = 'none';
      document.getElementById('modal-image-input').value = '';
    }

    window.saveNote = async function() {
      const title = document.getElementById('note-title-input').value.trim();
      let text = document.getElementById('note-text-input').value.trim();
      const linkUrl = document.getElementById('modal-link-url').value.trim();
      const linkTitle = document.getElementById('modal-link-title').value.trim();
      const cat = document.getElementById('note-cat-select').value;
      const isLocked = document.getElementById('modal-secure-toggle').checked;
      const pass = document.getElementById('modal-secure-password').value.trim();

      if (isLocked && !pass) {
        alert("אנא הזן סיסמה לנעילת הפתק.");
        return;
      }

      if (!title && !text && !currentImageBase64 && !linkUrl) return;

      if (isLocked) {
        text = CryptoJS.AES.encrypt(text, pass).toString();
        if (editingNoteId) unlockedNotes[editingNoteId] = pass;
      }

      const now = new Date();
      const dayName = now.toLocaleDateString('he-IL', { weekday: 'short' });
      const dateOnly = now.toLocaleDateString('he-IL');
      const timeOnly = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
      const dateStr = `${dayName}, ${dateOnly}, ${timeOnly}`;
      
      const timestamp = Date.now();

      try {
        if (editingNoteId) {
          await updateDoc(doc(db, "notes", editingNoteId), { 
            title: title || null,
            text: text, 
            category: cat,
            imageUrl: currentImageBase64 || null,
            linkUrl: linkUrl || null,
            linkTitle: linkTitle || null,
            isLocked: isLocked,
            lastEditedBy: null,
            lastEditedById: null
          });
          showToast("הפתק עודכן בהצלחה");
        } else {
          const docRef = await addDoc(collection(db, "notes"), {
            title: title || null,
            text: text, 
            category: cat, 
            imageUrl: currentImageBase64 || null,
            linkUrl: linkUrl || null,
            linkTitle: linkTitle || null,
            date: dateStr, 
            createdAt: timestamp, 
            urgent: 'רגיל', 
            pinned: false, 
            archived: false, 
            isShared: false,
            shareMode: null,
            isLocked: isLocked,
            isPublic: false
          });
          if (isLocked) unlockedNotes[docRef.id] = pass;
          showToast("הפתק נוסף בהצלחה");
        }
        closeModal();
      } catch (err) { console.error(err); }
    }

    window.togglePin = async function(id) {
      closeAllDropdowns();
      const note = allNotes.find(n => n.id === id);
      if (note) await updateDoc(doc(db, "notes", id), { pinned: !note.pinned });
    }

    window.toggleUrgent = async function(id) {
      closeAllDropdowns();
      const note = allNotes.find(n => n.id === id);
      if (note) await updateDoc(doc(db, "notes", id), { urgent: note.urgent === 'דחוף' ? 'רגיל' : 'דחוף' });
    }

    window.toggleArchive = async function(id) {
      closeAllDropdowns();
      const note = allNotes.find(n => n.id === id);
      if (note) await updateDoc(doc(db, "notes", id), { archived: !note.archived });
    }

    window.deleteNote = async function(id) {
      closeAllDropdowns();
      if (confirm("האם למחוק פתק זה לצמיתות?")) await deleteDoc(doc(db, "notes", id));
    }

    window.exportBackup = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allNotes, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `notes_backup_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    window.triggerImport = function() { document.getElementById('import-file-input').click(); }

    window.importBackup = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const importedNotes = JSON.parse(e.target.result);
          if (confirm(`האם לייבא ${importedNotes.length} פתקים חדשים?`)) {
            for (let note of importedNotes) {
              await addDoc(collection(db, "notes"), { 
                title: note.title || null,
                text: note.text || '', 
                category: note.category || 'כללי', 
                imageUrl: note.imageUrl || null,
                linkUrl: note.linkUrl || null,
                linkTitle: note.linkTitle || null,
                date: note.date || new Date().toLocaleDateString('he-IL'), 
                createdAt: Date.now(), 
                urgent: note.urgent || 'רגיל', 
                pinned: note.pinned || false, 
                archived: note.archived || false,
                isShared: false,
                shareMode: null,
                isLocked: note.isLocked || false,
                isPublic: note.isPublic || false 
              });
            }
            showToast("הייבוא הושלם בהצלחה!");
          }
        } catch (err) { console.error(err); }
      };
      reader.readAsText(file);
    }

    window.addNewCategory = function() {
      const newCat = prompt("הכנס את שם הקטגוריה החדשה:");
      if (newCat && newCat.trim() !== "") {
        const name = newCat.trim();
        if (!categories.includes(name)) {
          categories.push(name);
          renderCategories();
          const noteCatSelect = document.getElementById('note-cat-select');
          if (noteCatSelect) noteCatSelect.value = name;
        }
      }
    }

    window.toggleArchiveView = function() {
      currentView = currentView === 'active' ? 'archived' : 'active';
      const archiveBtn = document.getElementById('archive-view-btn');
      if (archiveBtn) archiveBtn.innerText = currentView === 'active' ? '📦 ארכיון' : '📄 פתקים פעילים';
      renderNotes();
    }

    window.toggleFullscreenModal = function() {
      const modal = document.getElementById('modal-box');
      if (modal) modal.classList.toggle('fullscreen-mode');
    }

    window.showToast = function(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    window.escapeHtml = function(text) { return (text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    window.escapeRowText = function(text) { return (text || "").replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$').replace(/"/g, '&quot;'); }
  </script>
</body>
</html>
