<!-- חלונית בחירת קטגוריה למשימה המהירה -->
  <div class="overlay" id="task-cat-modal" onclick="if(event.target===this) closeTaskCatModal()">
    <div class="modal" style="max-width: 380px; border-radius: 16px;">
      <div class="modal-header-actions">
        <h2>בחר קטגוריה לפתק</h2>
        <button class="gear-menu-trigger" onclick="closeTaskCatModal()">✕</button>
      </div>
      <p style="font-size: 0.85rem; color: var(--text-muted);">בחר מתוך הקטגוריות הקיימות או הוסף קטגוריה חדשה:</p>
      
      <div class="form-group">
        <select id="task-cat-select" style="width: 100%;" aria-label="בחר קטגוריה למשימה"></select>
      </div>

      <div style="display: flex; gap: 8px;">
        <input type="text" id="new-task-cat-input" placeholder="או הכנס שם קטגוריה חדשה..." style="flex: 1;" dir="rtl">
        <button class="btn btn-submit" style="padding: 0 14px; border-radius: var(--radius);" onclick="addNewCategoryFromModal()">➕ הוסף</button>
      </div>

      <div class="modal-buttons" style="margin-top: 10px;">
        <button class="btn btn-block btn-cancel" onclick="closeTaskCatModal()">ביטול</button>
        <button class="btn btn-block btn-submit" onclick="confirmTaskConversion()">הפוך לפתק</button>
      </div>
    </div>
  </div>
